<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="deviceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="520" fill="#f8fafc"/>
  
  <!-- 标题 -->
  <text x="400" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Verge 边缘计算网关架构</text>
  
  <!-- ==================== 应用层 ==================== -->
  <rect x="30" y="45" width="740" height="120" rx="10" fill="url(#appGrad)" filter="url(#shadow)"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">应用层（云端服务器 / 本地桌面应用）</text>
  
  <!-- 应用层功能块 -->
  <rect x="50" y="85" width="120" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="110" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f46e5" font-weight="500">🔧 设备管理</text>
  
  <rect x="190" y="85" width="120" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="250" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f46e5" font-weight="500">⚡ 场景联动</text>
  
  <rect x="330" y="85" width="120" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="390" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f46e5" font-weight="500">📐 规则引擎</text>
  
  <rect x="470" y="85" width="120" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="530" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f46e5" font-weight="500">🖥️ 用户界面</text>
  
  <rect x="610" y="85" width="140" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="680" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f46e5" font-weight="500">📊 数据分析</text>
  
  <!-- 连接线 1 -->
  <line x1="400" y1="170" x2="400" y2="195" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <rect x="300" y="178" width="200" height="20" rx="10" fill="#e0e7ff"/>
  <text x="400" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4f46e5">SSE + JSON-RPC 2.0</text>
  
  <!-- ==================== 边缘层 ==================== -->
  <rect x="30" y="205" width="740" height="120" rx="10" fill="url(#edgeGrad)" filter="url(#shadow)"/>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">边缘层（Verge 网关）</text>
  
  <!-- 边缘层功能块 -->
  <rect x="50" y="245" width="160" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="130" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669" font-weight="500">🔌 设备接入</text>
  <text x="130" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Modbus/MQTT/HTTP</text>
  
  <rect x="230" y="245" width="160" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="310" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669" font-weight="500">📡 数据采集</text>
  <text x="310" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">实时点位读取</text>
  
  <rect x="410" y="245" width="160" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="490" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669" font-weight="500">🔄 协议转换</text>
  <text x="490" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Lua脚本扩展</text>
  
  <rect x="590" y="245" width="160" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="670" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669" font-weight="500">🌐 云边通信</text>
  <text x="670" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">设备影子/心跳</text>
  
  <!-- 连接线 2 -->
  <line x1="400" y1="330" x2="400" y2="355" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <rect x="310" y="338" width="180" height="20" rx="10" fill="#fef3c7"/>
  <text x="400" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#b45309">Modbus / MQTT / HTTP</text>
  
  <!-- ==================== 设备层 ==================== -->
  <rect x="30" y="365" width="740" height="80" rx="10" fill="url(#deviceGrad)" filter="url(#shadow)"/>
  <text x="60" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">物理设备</text>
  
  <!-- 设备图标 -->
  <text x="180" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">⚡ 电表</text>
  <text x="280" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">❄️ 空调</text>
  <text x="380" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">💡 照明</text>
  <text x="480" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">🌡️ 传感器</text>
  <text x="590" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">☀️ 光伏</text>
  <text x="700" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">🚪 门禁</text>
  
  <!-- 底部说明 -->
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">基于 driver-box 框架构建 · Apache License 2.0</text>
  
  <!-- 特性标签 -->
  <rect x="30" y="495" width="200" height="18" rx="9" fill="#dcfce7"/>
  <text x="130" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#166534">⚡ 极致轻量</text>
  
  <rect x="250" y="495" width="200" height="18" rx="9" fill="#dbeafe"/>
  <text x="350" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1e40af">🛡️ 高度稳定</text>
  
  <rect x="470" y="495" width="200" height="18" rx="9" fill="#fef3c7"/>
  <text x="570" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#92400e">📦 近零更新</text>
</svg>