<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="appGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="edgeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38ef7d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="deviceGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fc4a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f7b733;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Application Layer -->
  <rect x="40" y="30" width="720" height="140" rx="12" fill="url(#appGradient)" filter="url(#shadow)"/>
  <text x="400" y="60" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">应用层（云端服务器 / 本地桌面应用）</text>
  
  <!-- App Layer Boxes -->
  <rect x="80" y="80" width="130" height="60" rx="8" fill="white" fill-opacity="0.95"/>
  <text x="145" y="115" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="13" font-weight="500">设备管理</text>
  
  <rect x="230" y="80" width="130" height="60" rx="8" fill="white" fill-opacity="0.95"/>
  <text x="295" y="115" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="13" font-weight="500">场景联动</text>
  
  <rect x="380" y="80" width="130" height="60" rx="8" fill="white" fill-opacity="0.95"/>
  <text x="445" y="115" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="13" font-weight="500">规则引擎</text>
  
  <rect x="530" y="80" width="130" height="60" rx="8" fill="white" fill-opacity="0.95"/>
  <text x="595" y="115" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="13" font-weight="500">用户界面</text>
  
  <text x="400" y="155" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">✓ 快速迭代  ✓ 丰富体验</text>
  
  <!-- Arrow 1 -->
  <line x1="400" y1="175" x2="400" y2="195" stroke="#666" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="420" y="188" fill="#666" font-family="Arial, sans-serif" font-size="11">SSE + JSON-RPC（标准 API）</text>
  
  <!-- Edge Layer -->
  <rect x="40" y="205" width="720" height="140" rx="12" fill="url(#edgeGradient)" filter="url(#shadow)"/>
  <text x="400" y="235" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">边缘层（Verge 网关）</text>
  
  <!-- Edge Layer Boxes -->
  <rect x="80" y="255" width="130" height="60" rx="8" fill="white" fill-opacity="0.95"/>
  <text x="145" y="290" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="13" font-weight="500">设备接入</text>
  
  <rect x="230" y="255" width="130" height="60" rx="8" fill="white" fill-opacity="0.95"/>
  <text x="295" y="290" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="13" font-weight="500">数据采集</text>
  
  <rect x="380" y="255" width="130" height="60" rx="8" fill="white" fill-opacity="0.95"/>
  <text x="445" y="290" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="13" font-weight="500">协议转换</text>
  
  <rect x="530" y="255" width="130" height="60" rx="8" fill="white" fill-opacity="0.95"/>
  <text x="595" y="290" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="13" font-weight="500">云边通信</text>
  
  <text x="400" y="330" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="12">✓ 极致轻量  ✓ 高度稳定</text>
  
  <!-- Arrow 2 -->
  <line x1="400" y1="350" x2="400" y2="370" stroke="#666" stroke-width="2"/>
  <text x="420" y="363" fill="#666" font-family="Arial, sans-serif" font-size="11">Modbus / MQTT / HTTP</text>
  
  <!-- Physical Devices Layer -->
  <rect x="40" y="380" width="720" height="100" rx="12" fill="url(#deviceGradient)" filter="url(#shadow)"/>
  <text x="400" y="415" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">物理设备</text>
  <text x="400" y="450" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="13">电表 / 空调 / 照明 / 传感器 / 光伏逆变器 / ...</text>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
</svg>