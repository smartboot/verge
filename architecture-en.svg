<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <!-- Application Layer: Commercial product, muted gray tones -->
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#64748b"/>
      <stop offset="100%" style="stop-color:#94a3b8"/>
    </linearGradient>
    <!-- Edge Layer: Core open-source product, prominent deep blue -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <!-- Device Layer: Keep orange -->
    <linearGradient id="deviceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Verge Edge Computing Gateway Architecture</text>
  
  <!-- ==================== Application Layer ==================== -->
  <rect x="30" y="45" width="740" height="100" rx="10" fill="url(#appGrad)" filter="url(#shadow)"/>
  <text x="60" y="68" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Application Layer (Cloud Server / Desktop App)</text>
  
  <!-- Application Layer Cards -->
  <rect x="50" y="80" width="120" height="45" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="110" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569" font-weight="500">🔧 Device Mgmt</text>
  
  <rect x="190" y="80" width="120" height="45" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="250" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569" font-weight="500">⚡ Scene Linkage</text>
  
  <rect x="330" y="80" width="120" height="45" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="390" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569" font-weight="500">📐 Rule Engine</text>
  
  <rect x="470" y="80" width="120" height="45" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="530" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569" font-weight="500">🖥️ User Interface</text>
  
  <rect x="610" y="80" width="140" height="45" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="680" y="107" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569" font-weight="500">📊 Analytics</text>
  
  <!-- Connection Line 1 -->
  <line x1="400" y1="150" x2="400" y2="175" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <rect x="300" y="155" width="200" height="20" rx="10" fill="#e2e8f0"/>
  <text x="400" y="169" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">SSE + JSON-RPC 2.0</text>
  
  <!-- ==================== Edge Layer (Extended for feature tags) ==================== -->
  <rect x="30" y="180" width="740" height="160" rx="10" fill="url(#edgeGrad)" filter="url(#shadow)"/>
  <text x="60" y="203" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Edge Layer (Verge Gateway)</text>
  
  <!-- Edge Layer Cards -->
  <rect x="50" y="215" width="160" height="45" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="130" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="500">🔌 Device Access</text>
  <text x="130" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Modbus/MQTT/HTTP</text>
  
  <rect x="230" y="215" width="160" height="45" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="310" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="500">📡 Data Collection</text>
  <text x="310" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Real-time Reading</text>
  
  <rect x="410" y="215" width="160" height="45" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="490" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="500">🔄 Protocol Conv.</text>
  <text x="490" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Lua Script Extension</text>
  
  <rect x="590" y="215" width="160" height="45" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="670" y="237" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1d4ed8" font-weight="500">🌐 Cloud-Edge Comm</text>
  <text x="670" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Shadow/Heartbeat</text>
  
  <!-- Verge Module Info (Embedded in Edge Layer) -->
  <text x="400" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Built on driver-box framework · Apache License 2.0</text>
  
  <!-- Feature Tags (Embedded in Edge Layer) -->
  <rect x="80" y="300" width="200" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
  <text x="180" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">⚡ Ultra-Light</text>
  
  <rect x="300" y="300" width="200" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
  <text x="400" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">🛡️ Highly Stable</text>
  
  <rect x="520" y="300" width="200" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
  <text x="620" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">📦 Near-Zero OTA</text>
  
  <!-- Connection Line 2 -->
  <line x1="400" y1="345" x2="400" y2="370" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <rect x="310" y="350" width="180" height="20" rx="10" fill="#fef3c7"/>
  <text x="400" y="364" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#b45309">Modbus / MQTT / HTTP</text>
  
  <!-- ==================== Device Layer ==================== -->
  <rect x="30" y="375" width="740" height="80" rx="10" fill="url(#deviceGrad)" filter="url(#shadow)"/>
  <text x="60" y="398" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Physical Devices</text>
  
  <!-- Device Icons -->
  <text x="180" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">⚡ Meter</text>
  <text x="280" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">❄️ HVAC</text>
  <text x="380" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">💡 Lighting</text>
  <text x="480" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">🌡️ Sensor</text>
  <text x="590" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">☀️ PV</text>
  <text x="700" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">🚪 Access</text>
  
  <!-- Application Layer Note (bottom right) -->
  <text x="770" y="490" text-anchor="end" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">Application Layer (verge-ui) is a commercial product, users can customize based on API</text>
</svg>