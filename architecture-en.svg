<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="appGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="deviceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ea580c"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="520" fill="#f8fafc"/>
  
  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b">Verge Edge Computing Gateway Architecture</text>
  
  <!-- ==================== Application Layer ==================== -->
  <rect x="30" y="45" width="740" height="120" rx="10" fill="url(#appGrad)" filter="url(#shadow)"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Application Layer (Cloud Server / Desktop App)</text>
  
  <!-- Application Layer Cards -->
  <rect x="50" y="85" width="120" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="110" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f46e5" font-weight="500">🔧 Device Mgmt</text>
  
  <rect x="190" y="85" width="120" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="250" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f46e5" font-weight="500">⚡ Scene Linkage</text>
  
  <rect x="330" y="85" width="120" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="390" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f46e5" font-weight="500">📐 Rule Engine</text>
  
  <rect x="470" y="85" width="120" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="530" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f46e5" font-weight="500">🖥️ User Interface</text>
  
  <rect x="610" y="85" width="140" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="680" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4f46e5" font-weight="500">📊 Analytics</text>
  
  <!-- Connection Line 1 -->
  <line x1="400" y1="170" x2="400" y2="195" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <rect x="300" y="178" width="200" height="20" rx="10" fill="#e0e7ff"/>
  <text x="400" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4f46e5">SSE + JSON-RPC 2.0</text>
  
  <!-- ==================== Edge Layer ==================== -->
  <rect x="30" y="205" width="740" height="120" rx="10" fill="url(#edgeGrad)" filter="url(#shadow)"/>
  <text x="60" y="230" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Edge Layer (Verge Gateway)</text>
  
  <!-- Edge Layer Cards -->
  <rect x="50" y="245" width="160" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="130" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669" font-weight="500">🔌 Device Access</text>
  <text x="130" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Modbus/MQTT/HTTP</text>
  
  <rect x="230" y="245" width="160" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="310" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669" font-weight="500">📡 Data Collection</text>
  <text x="310" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Real-time Reading</text>
  
  <rect x="410" y="245" width="160" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="490" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669" font-weight="500">🔄 Protocol Conv.</text>
  <text x="490" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Lua Script Extension</text>
  
  <rect x="590" y="245" width="160" height="50" rx="6" fill="white" fill-opacity="0.95"/>
  <text x="670" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#059669" font-weight="500">🌐 Cloud-Edge Comm</text>
  <text x="670" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#64748b">Shadow/Heartbeat</text>
  
  <!-- Connection Line 2 -->
  <line x1="400" y1="330" x2="400" y2="355" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <rect x="310" y="338" width="180" height="20" rx="10" fill="#fef3c7"/>
  <text x="400" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#b45309">Modbus / MQTT / HTTP</text>
  
  <!-- ==================== Device Layer ==================== -->
  <rect x="30" y="365" width="740" height="80" rx="10" fill="url(#deviceGrad)" filter="url(#shadow)"/>
  <text x="60" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Physical Devices</text>
  
  <!-- Device Icons -->
  <text x="180" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">⚡ Meter</text>
  <text x="280" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">❄️ HVAC</text>
  <text x="380" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">💡 Lighting</text>
  <text x="480" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">🌡️ Sensor</text>
  <text x="590" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">☀️ PV</text>
  <text x="700" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="14">🚪 Access</text>
  
  <!-- Footer -->
  <text x="400" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#94a3b8">Built on driver-box framework · Apache License 2.0</text>
  
  <!-- Feature Tags -->
  <rect x="80" y="495" width="200" height="18" rx="9" fill="#dcfce7"/>
  <text x="180" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#166534">⚡ Ultra-Light</text>
  
  <rect x="300" y="495" width="200" height="18" rx="9" fill="#dbeafe"/>
  <text x="400" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1e40af">🛡️ Highly Stable</text>
  
  <rect x="520" y="495" width="200" height="18" rx="9" fill="#fef3c7"/>
  <text x="620" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#92400e">📦 Near-Zero OTA</text>
</svg>